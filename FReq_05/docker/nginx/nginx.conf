worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    log_format balanced '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                        'upstream=$upstream_addr request_time=$request_time upstream_time=$upstream_response_time';

    access_log /dev/stdout balanced;

    upstream laravel_backend {
        zone laravel_backend 64k;
        resolver 127.0.0.11 valid=5s ipv6=off;
        least_conn;
        server app1:8000 resolve max_fails=3 fail_timeout=10s;
        server app2:8000 resolve max_fails=3 fail_timeout=10s;
        server app3:8000 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 8000;
        server_name _;
        client_max_body_size 10m;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://laravel_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;
            add_header X-Upstream $upstream_addr always;
        }
    }
}
