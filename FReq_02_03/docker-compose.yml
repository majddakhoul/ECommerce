services:
  app:
    build: .
    container_name: ecommerce_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ecommerce
      DB_USERNAME: ecommerce
      DB_PASSWORD: secret
      DB_READ_CONNECTION: mysql
      CACHE_STORE: redis
      REDIS_HOST: redis
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      INVENTORY_ENABLED: "true"
      INVENTORY_GRPC_ADDRESS: inventory:50051
    volumes:
      - product_images:/var/www/html/storage/app/public
      - app_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      inventory:
        condition: service_healthy
  db:
    image: mysql:8.0
    container_name: ecommerce_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - db_data:/var/lib/mysql
  inventory-db:
    image: mysql:8.0
    container_name: ecommerce_inventory_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: inventory
      MYSQL_USER: inventory
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - inventory_db_data:/var/lib/mysql
  inventory:
    build: ./inventory-service
    container_name: ecommerce_inventory
    restart: unless-stopped
    environment:
      GRPC_ADDR: ":50051"
      INVENTORY_DSN: "inventory:secret@tcp(inventory-db:3306)/inventory?parseTime=true"
    ports:
      - "50051:50051"
    depends_on:
      inventory-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 50051"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
  phpmyadmin:
    image: phpmyadmin:5
    container_name: ecommerce_pma
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
volumes:
  db_data:
  inventory_db_data:
  product_images:
  app_logs:
